# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtrackr
spring.datasource.username=ujjwalchaudhari
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# App
server.port=8080
spring.application.name=jobtrackr

#JWT
jwt.secret=jobtrackr-super-secret-key-minimum-256-bits-long-enough
jwt.expiration=86400000

# Active profile ? change to 'prod' in production
spring.profiles.active=local